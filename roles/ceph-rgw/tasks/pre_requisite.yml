---
- name: Create rados gateway directories
  ansible.builtin.file:
    path: "/var/lib/ceph/radosgw/{{ cluster }}-rgw.{{ rgw_zone }}.{{ ansible_facts['hostname'] }}.{{ item.instance_name }}"
    state: directory
    owner: "{{ ceph_uid if containerized_deployment | bool else 'ceph' }}"
    group: "{{ ceph_uid if containerized_deployment | bool else 'ceph' }}"
    mode: "{{ ceph_directories_mode }}"
  delegate_to: "{{ groups.get(mon_group_name, [])[0] }}"
  loop: "{{ rgw_instances }}"
  when: groups.get(mon_group_name, []) | length > 0

- name: Create rados gateway instance key
  ceph_key:
    name: "client.rgw.{{ rgw_zone }}.{{ ansible_facts['hostname'] }}.{{ item.instance_name }}"
    cluster: "{{ cluster }}"
    dest: "/var/lib/ceph/radosgw/{{ cluster }}-rgw.{{ rgw_zone }}.{{ ansible_facts['hostname'] }}.{{ item.instance_name }}/keyring"
    state: present
    # The value below must be valid JSON starting with "{" to be automatically
    # converted to a dict by Ansible
    caps: >-
      {% if rgw_create_pools -%}
      {"mon": "allow r",
       "osd": "{% for name in rgw_create_pools %}allow rwx pool={{ name }}{% if not loop.last %}, {% endif %}{% endfor %}"}
      {% else -%}
      {"osd": "allow rwx",
       "mon": "allow rw"}
      {% endif %}
    import_key: True
    owner: "{{ ceph_uid if containerized_deployment | bool else 'ceph' }}"
    group: "{{ ceph_uid if containerized_deployment | bool else 'ceph' }}"
    mode: "0600"
  no_log: "{{ no_log_on_ceph_key_tasks }}"
  delegate_to: "{{ groups[mon_group_name][0] if groups.get(mon_group_name, []) | length > 0 else 'localhost' }}"
  environment:
    CEPH_CONTAINER_IMAGE: "{{ ceph_docker_registry + '/' + ceph_docker_image + ':' + ceph_docker_image_tag if containerized_deployment else None }}"
    CEPH_CONTAINER_BINARY: "{{ container_binary }}"
  loop: "{{ rgw_instances }}"
  when: cephx | bool
  delegate_to: '{{ groups[mon_group_name][0] }}'

- name: Get rados gateway keys from monitors
  command: "{{ container_exec_cmd }} ceph --cluster {{ cluster }} auth get client.rgw.{{ rgw_zone }}.{{ ansible_facts['hostname'] }}.{{ item.instance_name }}"
  register: _rgw_keys
  loop: "{{ rgw_instances }}"
  delegate_to: '{{ groups[mon_group_name][0] }}'
  check_mode: false
  changed_when: false
  when: cephx | bool

- name: Put rados gateway keys
  copy:
    dest: /var/lib/ceph/radosgw/{{ cluster }}-rgw.{{ rgw_zone }}.{{ ansible_facts['hostname'] }}.{{ item.item.instance_name }}/keyring
    content: "{{ item.stdout }}\n"
    owner: "ceph"
    group: "ceph"
    mode: "0600"
  loop: "{{ _rgw_keys.results }}"
  when: cephx | bool
